name: Make Edge.wim

on:
  workflow_dispatch:
  schedule:
    # Runs at 20 minutes past the hour, every 12 hours, starting at 04:00.
    - cron: "20 4/12 * * *"

concurrency:
  group: make-edge-wim
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  check:
    runs-on: windows-latest
    outputs:
      update_needed: ${{ steps.check_edge.outputs.update_needed }}
      current_version: ${{ steps.check_edge.outputs.current_version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for Edge updates
        id: check_edge
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          .\make.ps1 -CheckOnly
          $version = Get-Content ".\Edge_Version.txt"
          echo "current_version=$version" >> $env:GITHUB_OUTPUT

          git diff --quiet -- ".\Edge_Version.txt"
          $versionChanged = $LASTEXITCODE -eq 1
          if ($LASTEXITCODE -notin 0, 1) {
            throw "Failed to compare Edge_Version.txt with the repository version."
          }

          $requiredAssets = @(
            "Edge_Version.txt"
            "Edge_x86.wim"
            "Edge_x64.wim"
            "Edge_arm64.wim"
          )
          $releaseJson = gh release view "v$version" --json assets 2>$null
          $releaseExists = $LASTEXITCODE -eq 0
          if ($releaseExists) {
            $releaseAssets = @($releaseJson | ConvertFrom-Json | ForEach-Object { $_.assets.name })
          } else {
            Write-Host "Release v$version does not exist yet."
            $releaseAssets = @()
          }
          $missingAssets = @($requiredAssets | Where-Object { $_ -notin $releaseAssets })

          if ($versionChanged -or $missingAssets.Count -gt 0) {
            if ($versionChanged) {
              Write-Host "New Edge version detected: $version"
            }
            if ($missingAssets.Count -gt 0) {
              Write-Host "Release v$version is missing: $($missingAssets -join ', ')"
            }
            echo "update_needed=true" >> $env:GITHUB_OUTPUT
          } else {
            Write-Host "Edge $version is already fully published."
            echo "update_needed=false" >> $env:GITHUB_OUTPUT
          }

          # Reset the exit code: git diff --quiet and gh release view may
          # leave a non-zero $LASTEXITCODE, which would fail this step.
          exit 0

  build:
    needs: check
    if: needs.check.outputs.update_needed == 'true'
    runs-on: windows-latest
    strategy:
      matrix:
        architecture: [x86, x64, arm64]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Edge.wim for ${{ matrix.architecture }}
        shell: pwsh
        run: .\make.ps1 -Architecture ${{ matrix.architecture }}

      - name: Store Edge.wim
        uses: actions/upload-artifact@v4
        with:
          name: edge-${{ matrix.architecture }}
          path: Edge_${{ matrix.architecture }}.wim
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  publish:
    needs: [check, build]
    if: needs.check.outputs.update_needed == 'true'
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download Edge.wim files
        uses: actions/download-artifact@v4
        with:
          pattern: edge-*
          merge-multiple: true

      - name: Commit version and publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = "${{ needs.check.outputs.current_version }}"
          $version | Out-File -FilePath ".\Edge_Version.txt" -Force -Encoding UTF8 -NoNewline

          $requiredFiles = @(
            ".\Edge_Version.txt"
            ".\Edge_x86.wim"
            ".\Edge_x64.wim"
            ".\Edge_arm64.wim"
          )
          $missingFiles = @($requiredFiles | Where-Object { -not (Test-Path -LiteralPath $_) })
          if ($missingFiles.Count -gt 0) {
            throw "Cannot publish v$version because files are missing: $($missingFiles -join ', ')"
          }

          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add ".\Edge_Version.txt"
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 1) {
            git commit -m "Update Edge version to $version" || throw "Failed to commit Edge version $version."
            git push || throw "Failed to push Edge version $version."
          } elseif ($LASTEXITCODE -ne 0) {
            throw "Failed to inspect the staged Edge version change."
          }

          $remoteTag = git ls-remote --tags origin "refs/tags/v$version"
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to query tag v$version."
          }
          if ($remoteTag) {
            Write-Host "Tag v$version already exists."
          } else {
            git tag "v$version" || throw "Failed to create tag v$version."
            git push origin "v$version" || throw "Failed to push tag v$version."
          }

          gh release view "v$version" --json tagName *> $null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Release v$version already exists; replacing its assets."
          } else {
            gh release create "v$version" --draft --title "Edge $version" --notes "Automatically built Edge $version wim files" || throw "Failed to create draft release v$version."
          }

          gh release upload "v$version" @requiredFiles --clobber || throw "Failed to upload assets for release v$version."
          gh release edit "v$version" --draft=false --latest || throw "Failed to publish release v$version."
